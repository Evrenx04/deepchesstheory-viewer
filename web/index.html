<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hamle hamle anlatılan, motorla doğrulanmış satranç açılış çalışmaları." />
    <title>Açılış Çalışması</title>
    <script>
      // The reader's theme and sizes before the first paint (src/lib/settings.ts keeps them in sync).
      (function () {
        var s = {};
        try {
          s = JSON.parse(localStorage.getItem("settings") || "{}");
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.theme = s.theme === "light" ? "light" : "dark";
        root.dataset.text = s.text === "s" || s.text === "l" ? s.text : "m";
        root.dataset.board = s.board === "m" || s.board === "s" ? s.board : "l";
        // A first visit: Turkish for a Turkish browser, English for every other (as browserLang in settings.ts).
        var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
        var lang = s.lang === "en" || s.lang === "tr" ? s.lang : "en";
        if (s.lang !== "en" && s.lang !== "tr")
          for (var i = 0; i < langs.length; i++) if (String(langs[i]).toLowerCase().indexOf("tr") === 0) lang = "tr";
        if (lang === "en") {
          root.lang = "en";
          document.title = "Opening Study";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
